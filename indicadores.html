<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VoltOS — Indicadores</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12161F" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="bolt">⚡</span> VoltOS</div>
    <div class="topbar-right">
      <a href="painel.html" class="btn-ghost">← Painel</a>
      <a href="relatorio.html" class="btn-ghost">Relatório</a>
      <a href="admin.html" class="btn-ghost">Administração</a>
      <span id="nome-usuario"></span>
      <button class="btn-ghost" id="btn-sair">Sair</button>
    </div>
  </div>

  <div class="container">
    <h2 style="margin-top:0">Indicadores</h2>

    <div class="tabs" id="periodos"></div>

    <form class="periodo-custom" id="form-periodo">
      <div class="field"><label for="f-de">De</label><input id="f-de" type="date" /></div>
      <div class="field"><label for="f-ate">Até</label><input id="f-ate" type="date" /></div>
      <button type="submit" class="btn-secondary">Aplicar</button>
    </form>

    <div id="conteudo-indicadores"></div>
  </div>

  <script type="module" src="js/indicadores.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>

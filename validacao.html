<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VoltOS — Validação</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12161F" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="bolt">⚡</span> VoltOS</div>
    <div class="topbar-right">
      <a href="painel.html" class="btn-ghost">← Painel</a>
      <a href="indicadores.html" class="btn-ghost">Indicadores</a>
      <a href="relatorio.html" class="btn-ghost">Relatório</a>
      <span id="nome-usuario"></span>
      <button class="btn-ghost" id="btn-sair">Sair</button>
    </div>
  </div>

  <div class="container">
    <h2 style="margin-top:0">Validação</h2>
    <p class="val-ajuda">
      Preencha a <strong>chave</strong> que o sistema primário gerou para cada O.S. (só números,
      mínimo 10 dígitos). A lista atualiza sozinha a cada 30 segundos.
    </p>

    <div class="tabs" id="tabs-val">
      <button class="tab ativa" data-modo="pendentes">Pendentes</button>
      <button class="tab" data-modo="validadas">Já validadas</button>
    </div>

    <div id="lista-validacao"></div>
  </div>

  <script type="module" src="js/validacao.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
